name: Keep Render Warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping frontend
        run: curl -f https://marino-front.onrender.com || exit 1

      - name: Ping backend
        run: curl -f https://marino-back.onrender.com/api/health || exit 1
