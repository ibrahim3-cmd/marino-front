name: Keep Render Warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping frontend
        run: |
          curl --fail --retry 3 --retry-delay 10 --max-time 30 https://marino-front.onrender.com || exit 1

      - name: Ping backend
        run: |
          curl --fail --retry 3 --retry-delay 10 --max-time 30 https://marino-back.onrender.com/api/health || exit 1
